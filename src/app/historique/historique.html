<div class="main-layout">
  <app-sidebar></app-sidebar>

  <div class="reddit-container">
    <div class="content-wrapper">
      <div class="header">
        <h1 class="title">Historique</h1>
      </div>

      <div class="search-container">
        <input
          type="text"
          [(ngModel)]="searchTerm"
          class="search-bar"
          placeholder="Rechercher dans l’historique..."
        />
      </div>

      <div class="posts-list">
        <div *ngFor="let item of filteredItems" class="post-card">
          <div class="post-header">
            <h3 class="post-title">{{ item.title }}</h3>
            <span class="post-source">({{ item.source }})</span>
          </div>
          <p class="post-author">Auteur : {{ item.author }}</p>
          <a [href]="item.url" target="_blank" class="post-link">Voir plus</a>
        </div>

        <p *ngIf="filteredItems.length === 0" class="no-results">
          Aucun résultat trouvé
        </p>
      </div>
    </div>
  </div>
</div>
